  <path d="M128 230 L140 204 C148 188 158 178 172 172 L184 144 C194 124 210 110 230 104 L254 96 C266 94 276 98 282 108 L288 120 C278 140 262 154 242 164 C222 174 206 176 188 188 C170 200 150 214 128 230 Z" fill="#355565"/>
  <!-- cut, flat crown facing the light -->
  <path d="M186 138 C196 120 212 108 232 102 L256 94 C266 92 274 96 280 104 L272 116 L232 130 L196 146 Z" fill="#406474"/>
  <!-- the small knob past the notch -->
  <path d="M302 112 C310 106 320 108 326 116 C330 126 328 136 322 142 L306 128 Z" fill="#355565"/>
  <!-- chipped steps on the left, flat faces turned to the light -->
  <path d="M88 252 L104 214 L124 210 L112 236 C102 252 96 270 94 290 C90 280 88 266 88 252 Z" fill="#33505f"/>
  <path d="M146 160 L160 128 L176 134 L164 166 Z" fill="#3a5d6c"/>

  <!-- shoulder, its own lit top -->
  <path d="M344 178 C362 176 380 184 392 198 L404 218 C410 232 410 248 404 262 C384 268 364 266 346 258 C350 236 350 206 344 178 Z" fill="#2c4859"/>
  <path d="M350 184 C364 184 378 190 388 202 L396 216 C380 222 364 222 352 218 C354 206 353 194 350 184 Z" fill="#355565"/>
  <!-- the shadowed crease between mass and shoulder -->
  <path d="M344 170 L354 184 C358 222 356 264 340 304 C336 262 340 214 344 170 Z" fill="#17293a"/>

  <!-- darker band where it meets the ground -->
  <path d="M74 362 C110 378 190 386 262 384 C324 382 372 368 396 336 C390 354 376 362 356 366 C320 382 250 388 180 384 C130 382 92 376 74 362 Z" fill="#132535"/>

  <!-- lichen, following the surface -->
  <g fill="#1a5559" opacity="0.75">
    <path d="M200 160 C206 152 222 152 228 160 C232 168 220 173 211 172 C202 171 196 167 200 160 Z"/>
    <path d="M256 110 C260 106 269 106 271 111 C272 116 265 118 260 117 C255 116 253 114 256 110 Z"/>
    <path d="M140 254 C144 248 156 248 158 254 C160 260 150 262 145 261 C140 260 138 258 140 254 Z" opacity="0.8"/>
    <path d="M364 200 C369 195 379 196 381 201 C382 206 374 208 369 207 C364 206 362 204 364 200 Z" opacity="0.6"/>
  </g>

  <!-- cracks, curving with the surface -->
  <g fill="none" stroke="#11222f" stroke-linecap="round" stroke-linejoin="round">
    <path d="M238 104 C230 132 224 160 230 190 C234 216 218 244 200 268 C190 282 186 304 190 330" stroke-width="3.4"/>
