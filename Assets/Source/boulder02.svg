<!-- Second boulder for Against Them (draft): a craggy two-part rock. A taller
     mass on the left with chipped steps and a cut, flat-topped crown, a notch
     with a small knob, and a lower shoulder to the right, split from it by a
     shadowed crease. Two small stones at its left foot. Same look as
     boulder01: seen from ~50 degrees above, stepped flat colour bands lit from
     the nebula (upper left), darkest where it turns away and meets the
     ground. No light rim lines. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 420" width="460" height="420">

  <!-- ===== main boulder, darkest band first ===== -->
  <!-- 1: silhouette -->
  <path d="M70 360 L64 330 C60 300 72 272 88 252 L104 214 C112 190 126 172 146 160 L160 128 C170 104 192 86 218 80 L246 70 C262 66 280 70 290 82 L300 98 C306 92 318 92 328 100 C344 112 350 132 348 152 L344 170 C360 168 380 176 394 190 L410 214 C420 232 422 256 414 278 L404 300 C400 330 384 352 356 366 C320 382 250 388 180 384 C130 382 92 376 70 360 Z" fill="#1c3240"/>
  <!-- 2: all but the side turned away (lower right) -->
  <path d="M70 356 C62 320 70 280 88 252 L104 214 C112 190 126 172 146 160 L160 128 C170 104 192 86 218 80 L246 70 C262 66 280 70 290 82 L300 98 C306 92 318 92 328 100 C344 112 350 132 348 152 L344 170 C360 168 380 176 394 190 L410 214 C418 228 420 244 418 258 C380 300 320 330 250 342 C180 352 110 356 70 356 Z" fill="#243d4c"/>

  <!-- upper mass -->
