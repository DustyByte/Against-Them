    <path d="M200 268 C214 274 224 288 226 302" stroke-width="1.6"/>
    <path d="M344 170 C352 222 352 262 340 304" stroke-width="2.6"/>
    <path d="M384 210 C388 234 382 256 390 280" stroke-width="2.2"/>
    <path d="M128 292 C138 312 136 332 146 352" stroke-width="2.4"/>
    <path d="M300 98 C302 108 304 116 306 128" stroke-width="2"/>
  </g>
  <!-- lit lip on the light side of the long crack, so it reads as a groove -->
  <path d="M232 106 C224 134 218 162 224 190" fill="none" stroke="#5a8796" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>


  <!-- ===== two small stones at its left foot, same banding ===== -->
