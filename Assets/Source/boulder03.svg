<!-- Third boulder for Against Them (draft): a cluster of three rocks. A big
     angular-topped rock at the back, a rounded one in front of it on the
     left and a small chipped one at the front right, with a pebble between,
     each casting a little shade on the rock behind. Same look as
     boulder01/02: seen from ~50 degrees above, stepped flat colour bands lit
     from the nebula (upper left), darkest where it turns away and meets the
     ground. No light rim lines. -->
