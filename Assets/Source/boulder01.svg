<!-- Source for Assets/World Objects/Boulder01.png, which adds a soft contact
     shadow and is drawn at 0.8 scale, cropped. The grass at its base is real
     swaying grass, added in game (boulder.gd).
     Night boulder for Against Them, seen from a camera ~50 degrees above the
     ground. Rounded, not flat-topped: its volume is shown with stepped flat
     colour bands nested towards the light (the nebula, upper left), with
     curved edges between them, brightest on the crown and darkening as the
     surface turns away and down to the ground. Palette from the in-game
     ground (#0a2a3a), grass (#105058) and nebula-lit edges (#c0e8e0). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" width="520" height="390">

  <!-- ===== main boulder, darkest band first ===== -->
  <!-- 1: silhouette, the side turned fully away -->
  <path d="M70 300 C56 250 80 190 130 152 C170 122 220 100 280 96 C350 92 420 112 456 156 C482 190 486 250 470 288 C452 322 400 338 320 344 C240 350 150 344 100 326 C84 320 74 312 70 300 Z" fill="#1c3240"/>
  <!-- 2 -->
  <path d="M70 296 C58 248 82 190 130 152 C170 122 220 100 280 96 C350 92 420 112 456 156 C474 180 480 214 476 246 C440 290 380 316 300 322 C210 328 120 322 70 296 Z" fill="#243d4c"/>
  <!-- 3 -->
  <path d="M74 268 C68 226 94 182 134 154 C172 126 222 104 280 100 C346 96 410 114 446 152 C462 170 468 194 466 216 C440 240 420 252 398 264 C372 276 356 272 330 282 C306 290 290 286 270 290 C236 296 216 290 190 294 C150 298 106 286 74 268 Z" fill="#2c4859"/>
  <!-- 4 -->
  <path d="M92 226 C96 192 124 162 160 140 C198 118 240 106 286 104 C340 102 392 116 424 144 C434 158 436 174 432 188 C404 206 386 214 362 222 C344 228 336 222 318 232 C296 242 270 240 250 244 C222 246 206 240 186 244 C150 248 118 240 92 226 Z" fill="#355565"/>
  <!-- 5: crown, facing up into the nebula light -->
  <path d="M132 176 C148 150 184 128 226 117 C268 107 312 107 352 115 C340 134 324 146 306 154 C290 162 282 158 266 168 C248 178 226 176 206 182 C180 188 152 186 132 176 Z" fill="#406474"/>

  <!-- a bulge on the right flank: its own small highlight band -->
  <path d="M402 196 C420 190 440 196 452 212 C456 230 448 248 432 256 C430 236 422 214 402 196 Z" fill="#2c4859"/>

  <!-- darker band where it meets the ground -->
  <path d="M74 304 C110 326 190 340 280 340 C370 340 434 322 466 294 C452 322 400 338 320 344 C240 350 150 344 100 326 C88 320 78 312 74 304 Z" fill="#132535"/>

  <!-- lichen, following the dome -->
  <g fill="#1a5559" opacity="0.75">
    <path d="M206 160 C214 152 232 152 238 160 C242 168 230 174 220 172 C210 172 202 168 206 160 Z"/>
    <path d="M246 146 C250 142 260 142 262 147 C263 152 256 154 251 153 C246 152 244 150 246 146 Z"/>
    <path d="M150 204 C154 198 166 198 168 204 C170 210 160 212 155 211 C150 210 148 208 150 204 Z" opacity="0.8"/>
    <path d="M362 178 C368 172 382 173 384 180 C385 186 374 188 368 187 C362 186 359 183 362 178 Z" opacity="0.6"/>
  </g>

  <!-- cracks, curving with the surface -->
  <g fill="none" stroke="#11222f" stroke-linecap="round" stroke-linejoin="round">
    <path d="M276 106 C292 132 304 160 302 196 C300 226 312 252 334 276 C344 288 348 302 346 316" stroke-width="4"/>
    <path d="M302 196 C320 192 338 194 354 202" stroke-width="2"/>
    <path d="M334 276 C326 286 314 290 300 290" stroke-width="1.8"/>
    <path d="M118 222 C132 240 130 264 146 284 C154 294 156 306 152 318" stroke-width="3.4"/>
    <path d="M412 234 C406 254 410 272 402 292" stroke-width="2.6"/>
  </g>
  <!-- lit lip on the light side of the long crack, so it reads as a groove -->
  <path d="M270 108 C286 134 297 161 296 196" fill="none" stroke="#5a8796" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>


  <!-- ===== smaller stone at its foot, same banding ===== -->
  <path d="M402 336 C398 310 414 288 440 280 C466 272 496 282 506 304 C514 322 508 346 488 356 C464 368 422 366 408 354 C404 348 402 342 402 336 Z" fill="#1c3240"/>
  <path d="M404 330 C402 306 418 288 442 282 C466 276 494 284 504 302 C506 318 498 334 480 342 C454 352 420 346 404 330 Z" fill="#2a4555"/>
