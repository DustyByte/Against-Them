  <path d="M408 316 C410 298 424 286 442 282 C462 278 486 284 498 296" fill="none" stroke="#a9dcd6" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
  <path d="M458 296 C466 306 478 312 490 314" fill="none" stroke="#11222f" stroke-width="2.4" stroke-linecap="round"/>
</svg>
