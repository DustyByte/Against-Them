<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="round"><rect width="256" height="256" rx="56" ry="56"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#21173a"/><stop offset="1" stop-color="#07050d"/>
    </radialGradient>
    <radialGradient id="planet" cx="34%" cy="30%" r="80%">
      <stop offset="0" stop-color="#3b2d63"/><stop offset="0.6" stop-color="#1c1533"/><stop offset="1" stop-color="#0e0a1c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c9a6ff" stop-opacity="0.8"/>
      <stop offset="0.45" stop-color="#a87bff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a87bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4862"/><stop offset="1" stop-color="#2b3547"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#round)">
  <rect width="256" height="256" fill="url(#bg)"/>
  <!-- stars -->
  <g fill="#d9ccff">
    <circle cx="28" cy="34" r="1.6" opacity="0.8"/><circle cx="222" cy="28" r="1.4" opacity="0.7"/>
    <circle cx="236" cy="96" r="1.2" opacity="0.6"/><circle cx="18" cy="122" r="1.3" opacity="0.6"/>
    <circle cx="62" cy="16" r="1" opacity="0.5"/>
  </g>
  <!-- the planet Umbra behind Echo, lit from the top left -->
  <circle cx="128" cy="118" r="104" fill="url(#planet)"/>
  <path d="M42 70 A104 104 0 0 1 176 26" fill="none" stroke="#b48cff" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <path d="M56 46 A104 104 0 0 1 128 14" fill="none" stroke="#e2d2ff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- orbit line -->
  <ellipse cx="128" cy="150" rx="128" ry="26" fill="none" stroke="#a87bff" stroke-width="2" opacity="0.35" transform="rotate(-12 128 150)"/>
  <!-- cloak shoulders -->
  <path d="M30 262 C36 204 72 176 128 174 C184 176 220 204 226 262 Z" fill="#2b3547" stroke="#121b2b" stroke-width="5" stroke-linejoin="round"/>
  <path d="M128 186 L128 262" stroke="#11181c" stroke-width="4" stroke-linecap="round"/>
  <!-- hood -->
  <path d="M128 36 C174 36 202 72 202 116 C202 150 184 176 158 186 L98 186 C72 176 54 150 54 116 C54 72 82 36 128 36 Z" fill="url(#hood)" stroke="#121b2b" stroke-width="5" stroke-linejoin="round"/>
  <path d="M86 70 C98 52 116 46 128 46" fill="none" stroke="#56688a" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <ellipse cx="128" cy="122" rx="45" ry="52" fill="#11181c"/>
  <circle cx="128" cy="116" r="44" fill="url(#glow)"/>
  <ellipse cx="128" cy="116" rx="15" ry="21" fill="#c9a6ff"/>
  <ellipse cx="123" cy="108" rx="5" ry="7" fill="#f3ecff"/>
  </g>
</svg>
